<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Czy myślisz jak Protagoras?</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#d9e2ef;--accent:#3157d5;--accent2:#eef2ff;--ok:#0f9d58;--bad:#d93025;--shadow:0 12px 36px rgba(15,23,42,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef2ff 0,#f8fafc 40%,#f8fafc 100%);color:var(--ink);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 48px}.hero{display:flex;gap:18px;align-items:center;margin-bottom:18px}.badge{width:62px;height:62px;border-radius:18px;background:#111827;color:white;display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}
h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0}.sub{color:var(--muted);margin:.45rem 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.pill{font-size:14px;background:var(--accent2);color:#273fa3;border-radius:999px;padding:7px 11px;font-weight:700}.score{font-size:14px;color:var(--muted);font-weight:700}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden;margin:4px 0 22px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#3157d5,#6d5dfc);transition:width .25s ease}.q{font-size:24px;line-height:1.3;margin:0 0 18px}.answers{display:grid;gap:12px}.ans{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;font-size:17px;color:var(--ink);cursor:pointer;transition:.15s ease}.ans:hover{transform:translateY(-1px);border-color:#9eb0ea;background:#fafbff}.ans:disabled{cursor:default;transform:none}.ans.correct{border-color:#7ac79f;background:#effaf4}.ans.wrong{border-color:#ef9b95;background:#fff2f1}.feedback{display:none;margin-top:18px;border-radius:16px;padding:16px;background:#f8fafc;border:1px solid var(--line)}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:6px}.actions{display:flex;justify-content:flex-end;margin-top:16px}.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;cursor:pointer}.btn.secondary{background:#111827}.start{text-align:center;padding:18px 6px}.start p{font-size:18px;color:var(--muted);max-width:620px;margin:10px auto 22px}.result{text-align:center}.big{font-size:58px;font-weight:900;letter-spacing:-2px;margin:8px 0}.result h2{font-size:32px;margin:8px 0}.result p{color:var(--muted);font-size:18px}.legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.legend span{background:#f1f5f9;border-radius:999px;padding:7px 10px;font-size:13px}.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px;line-height:1.5}@media(max-width:600px){.card{padding:18px}.q{font-size:21px}.ans{font-size:16px}.hero{align-items:flex-start}.badge{width:52px;height:52px;border-radius:15px;font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div class="badge">Π</div><div><h1>Czy myślisz jak Protagoras?</h1><p class="sub">Gra podsumowująca: sofiści, Protagoras, relatywizm, praktycyzm i konwencjonalizm.</p></div></div>
  <main class="card" id="app"></main>
  <div class="foot">Materiał dydaktyczny przygotowany na podstawie: W. Tatarkiewicz, <em>Historia filozofii</em>, t. I, s. 72–78.</div>
</div>
<script>
const questions = [
{q:"Który opis najlepiej oddaje rolę sofistów w V w. p.n.e.?",a:["Byli przede wszystkim badaczami przyrody","Byli zawodowymi nauczycielami przygotowującymi do życia publicznego","Tworzyli zamkniętą szkołę religijną","Zajmowali się wyłącznie matematyką"],c:1,e:"Tatarkiewicz podkreśla, że sofiści byli nauczycielami i wychowawcami, a nauczanie stanowiło ich zawód."},
{q:"Jaki zwrot w przedmiocie filozofii wiąże Tatarkiewicz z sofistami?",a:["Od człowieka ku kosmosowi","Od geometrii ku astronomii","Od przyrody ku człowiekowi i kulturze","Od polityki ku teologii"],c:2,e:"Sofiści skierowali uwagę na człowieka i jego wytwory: język, politykę, etykę, prawo, sztukę i życie społeczne."},
{q:"Co najlepiej opisuje sensualizm Protagorasa?",a:["Poznanie zaczyna się od spostrzeżeń zmysłowych","Prawdziwe poznanie jest całkowicie niezależne od zmysłów","Wiedza pochodzi wyłącznie z tradycji","Zmysły zawsze wprowadzają w błąd"],c:0,e:"U Protagorasa poznanie wiąże się ze spostrzeżeniami, a stąd wyrasta problem ich względności."},
{q:"Jak najlepiej rozumieć zdanie „Wszystkich rzeczy miarą jest człowiek”?",a:["Człowiek jest fizycznie największą istotą","Każdy człowiek może dowolnie zmieniać fakty","Prawdziwość sądu jest związana z poznającym człowiekiem","Większość zawsze ma rację"],c:2,e:"W ujęciu Tatarkiewicza odpowiedź jest prawdziwa dla tego człowieka, który ją daje; różne perspektywy mogą więc prowadzić do sprzecznych sądów."},
{q:"Zdrowemu potrawa wydaje się słodka, choremu gorzka. Jaki pogląd ilustruje ten przykład?",a:["Dogmatyzm","Relatywizm","Materializm","Fatalizm"],c:1,e:"Przykład pokazuje zależność sądu od stanu i perspektywy poznającego."},
{q:"Co jest najważniejsze dla praktycyzmu Protagorasa?",a:["Każda opinia jest identycznie użyteczna","Należy zastępować przekonania mniej korzystne bardziej korzystnymi","Tylko matematyka daje wiedzę","Filozof powinien unikać życia publicznego"],c:1,e:"Tatarkiewicz pisze, że sofiści mogli uznawać różne sądy za równie prawdziwe, ale jedne za lepsze od drugich ze względu na pożytek."},
{q:"Które twierdzenie najlepiej wyraża konwencjonalizm?",a:["Prawo jest niezmienne, bo istnieje z natury","Prawo i normy mogą być wytworem ludzkiej umowy","Każda norma jest biologiczna","Prawo jest zawsze dziełem jednej osoby"],c:1,e:"Konwencjonalizm podkreśla umowny charakter części zjawisk społecznych, takich jak prawo, moralność czy język."},
{q:"Co oznacza u sofistów przeciwstawienie „natura – umowa”?",a:["Rozróżnienie między tym, co istnieje z natury, a tym, co ustanowione przez ludzi","Spór między Grekami i Persami","Przeciwstawienie ciała i duszy","Podział na wiedzę i niewiedzę"],c:0,e:"Tatarkiewicz przedstawia naturę i umowę jako dwa różne źródła porządku społecznego i norm."},
{q:"Jeśli prawda jest względna, po co — według praktycyzmu — nauczyciel lub sofista?",a:["Aby udowodnić, że uczeń zawsze się myli","Aby zmieniać przekonania mniej korzystne na bardziej korzystne","Aby zlikwidować wszelkie różnice zdań","Aby nauczać wyłącznie pamięciowo"],c:1,e:"Rola mędrca polega na zmianie stanu gorszego w lepszy — Tatarkiewicz porównuje tu działanie sofisty do działania lekarza."},
{q:"Jak zmieniło się historycznie znaczenie słowa „sofista”?",a:["Zawsze było wyłącznie obelgą","Początkowo miało sens dodatni, później nabrało znaczenia pejoratywnego","Najpierw oznaczało żołnierza, potem poetę","Nigdy nie zmieniało znaczenia"],c:1,e:"Tatarkiewicz przypomina, że początkowo słowo oznaczało człowieka uczonego; dopiero później stało się określeniem negatywnym."},
{q:"Które trzy pojęcia Tatarkiewicz wymienia przy estetyce sofistów?",a:["Harmonia, proporcja, piękno","Naśladowanie, iluzja, oczyszczenie","Wzniosłość, komizm, groteska","Forma, materia, cel"],c:1,e:"W części o początkach estetyki Tatarkiewicz wskazuje na naśladowanie, iluzję i oczyszczenie."},
{q:"Które zdanie najlepiej podsumowuje znaczenie Protagorasa i sofistów w tekście?",a:["Przywrócili wyłącznie filozofię przyrody","Skierowali filozofię ku człowiekowi i przygotowali grunt pod sensualizm, relatywizm, praktycyzm i konwencjonalizm","Odrzucili całkowicie edukację i politykę","Zajmowali się tylko techniką prowadzenia sporów"],c:1,e:"Tatarkiewicz podkreśla ich zwrot ku człowiekowi oraz znaczenie Protagorasa dla kilku ważnych stanowisk filozoficznych."}
];
let idx=0, score=0, locked=false;
const app=document.getElementById('app');
function start(){idx=0;score=0;locked=false;renderQuestion();}
function renderStart(){app.innerHTML=`<div class="start"><span class="pill">12 pytań · ok. 5–7 min</span><h2 style="font-size:32px;margin:18px 0 8px">Sprawdź, czy rozumiesz Protagorasa</h2><p>Wybierz jedną odpowiedź. Po każdym pytaniu zobaczysz krótkie wyjaśnienie, więc gra służy nie tylko sprawdzeniu, ale też uporządkowaniu pojęć.</p><button class="btn" onclick="start()">Rozpocznij grę</button></div>`;}
function renderQuestion(){locked=false;const q=questions[idx];app.innerHTML=`<div class="topline"><span class="pill">Pytanie ${idx+1} / ${questions.length}</span><span class="score">Punkty: ${score}</span></div><div class="progress"><div style="width:${(idx/questions.length)*100}%"></div></div><h2 class="q">${q.q}</h2><div class="answers">${q.a.map((x,i)=>`<button class="ans" onclick="choose(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions" id="actions"></div>`;}
function choose(i,btn){if(locked)return;locked=true;const q=questions[idx];const buttons=[...document.querySelectorAll('.ans')];buttons.forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct')});const fb=document.getElementById('fb');if(i===q.c){score++;fb.innerHTML=`<strong style="color:var(--ok)">Dobrze!</strong>${q.e}`;}else{btn.classList.add('wrong');fb.innerHTML=`<strong style="color:var(--bad)">Nie tym razem.</strong>${q.e}`;}fb.classList.add('show');document.getElementById('actions').innerHTML=`<button class="btn secondary" onclick="next()">${idx===questions.length-1?'Zobacz wynik':'Dalej'}</button>`;}
function next(){idx++; if(idx>=questions.length) renderResult(); else renderQuestion();}
function renderResult(){const pct=Math.round(score/questions.length*100);let msg='Wróć do czterech kluczowych pojęć i spróbuj jeszcze raz.';if(pct>=50)msg='Masz podstawy — kilka pojęć warto jeszcze uporządkować.';if(pct>=75)msg='Bardzo dobrze rozumiesz główne idee tekstu.';if(pct>=92)msg='Świetnie — potrafisz nie tylko rozpoznać pojęcia, ale też ich konsekwencje.';app.innerHTML=`<div class="result"><span class="pill">Koniec</span><div class="big">${score}/${questions.length}</div><h2>${pct}%</h2><p>${msg}</p><div class="legend"><span>sensualizm</span><span>relatywizm</span><span>praktycyzm</span><span>konwencjonalizm</span></div><div style="margin-top:24px"><button class="btn" onclick="start()">Zagraj ponownie</button></div></div>`;}
renderStart();
</script>
</body>
</html>
